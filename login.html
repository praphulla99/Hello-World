<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>College Trip | Login</title>
  <style>
    :root {
      --primary: #1d4ed8;
      --secondary: #2563eb;
      --accent: #f59e0b;
      --bg: #f8fafc;
      --text: #0f172a;
      --card: #ffffff;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(135deg, #dbeafe, #eff6ff);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .container {
      width: 100%;
      max-width: 420px;
      background: var(--card);
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.12);
      padding: 28px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 2rem;
      color: var(--primary);
    }

    p { margin: 0 0 22px; color: #334155; }

    nav {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }

    nav a {
      text-decoration: none;
      color: var(--primary);
      font-size: 0.9rem;
      background: #e2e8f0;
      padding: 6px 10px;
      border-radius: 999px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid #cbd5e1;
      margin-bottom: 14px;
      font-size: 1rem;
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 10px;
      background: var(--secondary);
      color: white;
      font-size: 1rem;
      padding: 12px;
      font-weight: bold;
      cursor: pointer;
    }

    .hint {
      margin-top: 12px;
      font-size: 0.85rem;
      color: #475569;
      text-align: center;
    }
  </style>
</head>
<body>
  <main class="container">
    <h1>College Trip</h1>
    <p>Sign in to plan and manage your college travel experiences.</p>

    <nav>
      <a href="login.html">Login</a>
      <a href="destinations.html">Destinations</a>
      <a href="vendors.html">Vendors</a>
      <a href="opportunity.html">Opportunity</a>
    </nav>

    <form>
      <label for="email">College Email</label>
      <input type="email" id="email" name="email" placeholder="you@college.edu" required />

      <label for="password">Password</label>
      <input type="password" id="password" name="password" placeholder="Enter your password" required />

      <button type="submit">Log In</button>
    </form>

    <p class="hint">New here? Ask your trip coordinator to create your account.</p>
  </main>
</body>
</html>
